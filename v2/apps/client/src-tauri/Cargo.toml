[package]
name = "percent_v2"
version = "0.0.0"
description = "Percent v2 local-first desktop client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "percent_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api"] }

